# Kitty terminal configuration

# Font
font_family      Hack Nerd Font Mono
bold_font        Hack Nerd Font Mono Bold
italic_font      Hack Nerd Font Mono Italic
bold_italic_font Hack Nerd Font Mono Bold Italic
font_size        16.0

# Cursor
cursor_shape block
cursor_blink_interval 0

# Scrollback
scrollback_lines 10000

# Mouse
mouse_hide_wait 3.0
copy_on_select clipboard

# Window
window_padding_width 8
hide_window_decorations no
confirm_os_window_close 0

# Tab bar
tab_bar_style powerline
tab_powerline_style slanted

# Bell
enable_audio_bell no
visual_bell_duration 0.0

# Colors (Monokai Pro)
foreground #fff1f3
background #2c2525

# Black
color0  #2c2525
color8  #72696a

# Red
color1  #fd6883
color9  #fd6883

# Green
color2  #adda78
color10 #adda78

# Yellow
color3  #f9cc6c
color11 #f9cc6c

# Blue
color4  #f38d70
color12 #f38d70

# Magenta
color5  #a8a9eb
color13 #a8a9eb

# Cyan
color6  #85dacc
color14 #85dacc

# White
color7  #fff1f3
color15 #fff1f3

# URL handling
url_style curly
open_url_with default

# Keyboard shortcuts

# Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+s paste_from_selection

# Scrolling
map ctrl+shift+up    scroll_line_up
map ctrl+shift+down  scroll_line_down
map ctrl+shift+page_up scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+home scroll_home
map ctrl+shift+end scroll_end

# Window management
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+w close_window
map ctrl+shift+] next_window
map ctrl+shift+[ previous_window

# Tab management
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+q close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab

# Font size
map ctrl+shift+equal change_font_size all +2.0
map ctrl+shift+minus change_font_size all -2.0
map ctrl+shift+0 change_font_size all 0

# tmux-like splits (using ctrl+space as prefix, matching tmux config)
map ctrl+space>| launch --location=vsplit --cwd=current
map ctrl+space>- launch --location=hsplit --cwd=current
map ctrl+space>h neighboring_window left
map ctrl+space>j neighboring_window down
map ctrl+space>k neighboring_window up
map ctrl+space>l neighboring_window right

# macOS specific
macos_option_as_alt yes
macos_quit_when_last_window_closed yes
