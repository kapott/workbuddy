# Portal backends for a sway session.
#
# xdg-desktop-portal-kde is installed for Plasma and would otherwise be picked
# here too, which breaks screen sharing under sway. wlr handles the screencast
# and screenshot interfaces; gtk handles the file chooser and the rest.

[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
